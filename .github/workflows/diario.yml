name: Robo Historias - video diario

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3). O GitHub atrasa ou pula agendamentos, então o robô
    # é acordado várias vezes; ele mesmo decide se ainda falta vídeo (máx. 2/dia, 4 h de intervalo).
    - cron: "17 15 * * *"   # 12:17 almoço
    - cron: "47 16 * * *"   # 13:47 nova tentativa
    - cron: "17 18 * * *"   # 15:17 nova tentativa
    - cron: "17 21 * * *"   # 18:17 noite
    - cron: "07 22 * * *"   # 19:07 nova tentativa
    - cron: "57 22 * * *"   # 19:57 nova tentativa
    - cron: "37 23 * * *"   # 20:37 nova tentativa
    - cron: "12 0 * * *"    # 21:12 logo após a cota da Cloudflare renovar
    - cron: "52 1 * * *"    # 22:52 nova tentativa
  workflow_dispatch:
    inputs:
      privacidade:
        description: "Privacidade do vídeo"
        type: choice
        options: [private, unlisted, public]
        default: private
      etapa:
        description: "completo = gera e publica | roteiro = só testa o roteiro, sem publicar"
        type: choice
        options: [completo, roteiro]
        default: completo
      ordem_texto:
        description: "Ordem dos provedores de texto (ex.: groq,gemini,cloudflare)"
        type: string
        default: "gemini,groq,cloudflare"
      estudio:
        description: "Estúdio (auto = rodízio)"
        type: choice
        options: [auto, flux, sdxl]
        default: auto

permissions:
  contents: write

concurrency:
  group: robo-historias
  cancel-in-progress: false

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg e fontes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Cache da voz offline (Piper)
        uses: actions/cache@v4
        with:
          path: modelos
          key: piper-pt_BR-faber-medium

      - name: Gerar e publicar o vídeo do dia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ORDEM_TEXTO: ${{ inputs.ordem_texto || 'gemini,groq,cloudflare' }}
          ESTUDIO: ${{ inputs.estudio == 'auto' && '' || inputs.estudio }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PRIVACIDADE: ${{ inputs.privacidade || '' }}
          FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          if [ "${{ inputs.etapa }}" = "roteiro" ]; then
            python -u -W ignore -m robo.roteiro
          else
            python -u -W ignore -m robo.principal
          fi

      - name: Guardar cópia do vídeo (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            saida/video.mp4
            saida/roteiro.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Salvar histórico no repositório
        if: always()
        run: |
          git config user.name "robo-historias[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in historico.json especies_dificeis.json uso_imagens.json docs/painel/dados.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "Histórico: execução de $(date -u +%F)"
          git pull -q --rebase origin main
          git push
