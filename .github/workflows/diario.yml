name: Robo Historias - video diario

on:
  schedule:
    - cron: "23 20 * * *"   # 17:23 em Brasília (20:23 UTC)
  workflow_dispatch:
    inputs:
      privacidade:
        description: "Privacidade do vídeo"
        type: choice
        options: [private, unlisted, public]
        default: private

permissions:
  contents: write

concurrency:
  group: robo-historias
  cancel-in-progress: false

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg e fontes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Cache da voz offline (Piper)
        uses: actions/cache@v4
        with:
          path: modelos
          key: piper-pt_BR-faber-medium

      - name: Gerar e publicar o vídeo do dia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PRIVACIDADE: ${{ inputs.privacidade || 'private' }}
        run: python -u -W ignore -m robo.principal

      - name: Guardar cópia do vídeo (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            saida/video.mp4
            saida/roteiro.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Salvar histórico no repositório
        if: success()
        run: |
          git config user.name "robo-historias[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico.json
          git diff --cached --quiet || git commit -m "Histórico: vídeo de $(date -u +%F)"
          git push
